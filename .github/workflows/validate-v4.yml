name: Validate Eteria v4
on:
  push:
    branches: [feature/eteria-v4-progression-world]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt pytest httpx
          pytest -q tests_backend.py
