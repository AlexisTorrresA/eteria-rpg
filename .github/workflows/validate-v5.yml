name: Validate Eteria 5 authored assets

on:
  push:
    branches:
      - feature/eteria-v5-kaykit-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Fetch and verify CC0 runtime assets
        working-directory: frontend
        run: npm run fetch:assets

      - name: Validate authored GLB rigs and weapon files
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          function glbJson(file) {
            const data = fs.readFileSync(file);
            const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
            if (view.getUint32(0, true) !== 0x46546c67) throw new Error(file + ': invalid GLB magic');
            let offset = 12;
            while (offset + 8 <= data.length) {
              const length = view.getUint32(offset, true);
              const type = view.getUint32(offset + 4, true);
              if (type === 0x4e4f534a) {
                return JSON.parse(data.subarray(offset + 8, offset + 8 + length).toString('utf8').replace(/\0+$/,'').trim());
              }
              offset += 8 + length;
            }
            throw new Error(file + ': JSON chunk missing');
          }

          const root = 'public/assets/kaykit/runtime';
          for (const relative of [
            'characters/Rogue.glb',
            'characters/Rogue_Hooded.glb',
            'characters/Knight.glb',
            'enemies/Skeleton_Rogue.glb',
            'enemies/Skeleton_Warrior.glb',
          ]) {
            const file = path.join(root, relative);
            const stat = fs.statSync(file);
            if (stat.size < 3_000_000) throw new Error(relative + ': unexpectedly small');
            const json = glbJson(file);
            if (!(json.skins?.length > 0)) throw new Error(relative + ': no skin/skeleton');
            if (!(json.animations?.length >= 20)) throw new Error(relative + ': insufficient animations');

            const names = (json.nodes || []).map((node) => node.name || '');
            const normalized = names.map((name) => name.toLowerCase().replace(/[^a-z0-9]/g,''));
            const hasRightHand = normalized.some((name) => name.includes('handr') || name.includes('righthand'));
            const hasLeftHand = normalized.some((name) => name.includes('handl') || name.includes('lefthand'));
            const hasHead = normalized.some((name) => name === 'head' || name.endsWith('head') || name.includes('headbone'));
            if (!hasRightHand || !hasLeftHand || !hasHead) {
              console.log('bone candidates', names.filter((name) => /hand|head|wrist/i.test(name)));
              throw new Error(relative + ': expected hand/head bones missing');
            }

            const clips = (json.animations || []).map((animation) => animation.name || '');
            if (!clips.some((name) => /idle/i.test(name))) throw new Error(relative + ': idle clip missing');
            if (!clips.some((name) => /walk/i.test(name))) throw new Error(relative + ': walk clip missing');
            if (!clips.some((name) => /run|sprint/i.test(name))) throw new Error(relative + ': run clip missing');
            if (!clips.some((name) => /attack|melee/i.test(name))) throw new Error(relative + ': attack clip missing');

            console.log(relative, {
              bytes: stat.size,
              skins: json.skins.length,
              animations: json.animations.length,
              bones: names.filter((name) => /hand|head|wrist/i.test(name)).slice(0,8),
              sampleClips: clips.filter((name) => /idle|walk|run|attack|dodge|roll/i.test(name)).slice(0,12),
            });
          }

          for (const name of ['sword_1handed','sword_2handed','dagger','axe_2handed','staff','crossbow_2handed']) {
            const jsonFile = path.join(root, 'weapons', name + '.gltf');
            const gltf = JSON.parse(fs.readFileSync(jsonFile,'utf8'));
            if (!gltf.meshes?.length) throw new Error(name + ': mesh missing');
            for (const buffer of gltf.buffers || []) {
              if (buffer.uri && !fs.existsSync(path.join(path.dirname(jsonFile), buffer.uri))) {
                throw new Error(name + ': missing buffer ' + buffer.uri);
              }
            }
            for (const image of gltf.images || []) {
              if (image.uri && !fs.existsSync(path.join(path.dirname(jsonFile), image.uri))) {
                throw new Error(name + ': missing texture ' + image.uri);
              }
            }
          }
          NODE

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate assets bundled into Vite output
        working-directory: frontend
        run: |
          test -s dist/assets/kaykit/runtime/characters/Rogue.glb
          test -s dist/assets/kaykit/runtime/characters/Knight.glb
          test -s dist/assets/kaykit/runtime/enemies/Skeleton_Rogue.glb
          test -s dist/assets/kaykit/runtime/weapons/sword_1handed.gltf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt pytest httpx
          pytest -q tests_backend.py
