name: Validate Eteria 5.1 camera and animation

on:
  push:
    branches:
      - feature/eteria-v5-1-camera-animation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend with authored assets
        working-directory: frontend
        run: npm run build

      - name: Verify dynamic-camera bundle and KayKit assets
        working-directory: frontend
        run: |
          test -s dist/assets/kaykit/runtime/characters/Rogue.glb
          test -s dist/assets/kaykit/runtime/weapons/axe_2handed.gltf
          grep -R "DynamicCameraController" src/cameraController.js
          grep -R "2H_Melee_Attack_Spinning" src/kaykitAssets.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt pytest httpx
          pytest -q tests_backend.py
