name: Bootstrap Eteria repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-project.yml'
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        run: |
          cat .bootstrap/chunk_*.b64 | base64 -d > /tmp/eteria-rpg.zip
          rm -rf /tmp/eteria-unpack
          mkdir -p /tmp/eteria-unpack
          unzip -q /tmp/eteria-rpg.zip -d /tmp/eteria-unpack
          rm -rf .bootstrap
          find /tmp/eteria-unpack/eteria-rpg -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/eteria-unpack/eteria-rpg -type f -name '*.pyc' -delete
          cp -a /tmp/eteria-unpack/eteria-rpg/. .
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit full project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initial Eteria 3D RPG"
          git push
